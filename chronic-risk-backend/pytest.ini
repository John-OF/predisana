[pytest]
testpaths = tests
# Silencia el ruido de deps (sdv/sdmetrics/sklearn deprecations) sin ocultar
# warnings propios del proyecto.
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
    ignore:X does not have valid feature names:UserWarning
    ignore:LightGBM binary classifier with TreeExplainer:UserWarning
