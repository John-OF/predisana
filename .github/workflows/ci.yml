# CI de Predisana (AUD-19). Dos jobs independientes: backend (pytest) y frontend
# (lint + build). El backend puede correr en CI porque el runtime ya no arrastra
# torch (AUD-17): requirements-dev.txt instala solo el API + pytest.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chronic-risk-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chronic-risk-backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # La suite usa una BD SQLite temporal y su propio ADMIN_TOKEN (conftest.py),
      # asi que no necesita secretos ni servicios externos.
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chronic-risk-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chronic-risk-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # AUD-19. Ojo: `translations.test.js` lee los *_features.json del BACKEND para
      # comprobar que ninguna feature servida llega a la UI sin etiqueta, asi que
      # necesita el repo entero (el checkout ya lo trae) y no solo esta carpeta.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Falla si aparece una vulnerabilidad alta o critica en las dependencias.
      - name: Auditoria de dependencias
        run: npm audit --audit-level=high
